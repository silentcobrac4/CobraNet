name: Build CobraNet APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;28.2.13676358" || true

      - name: Prepare project (extract archive if present)
        id: prepare
        run: |
          set -e
          if ls *.zip >/dev/null 2>&1; then
            ZIP=$(ls *.zip | head -n 1)
            echo "Found archive: $ZIP"
            rm -rf extracted
            mkdir extracted
            unzip -q "$ZIP" -d extracted
            PROJECT=$(find extracted -name pubspec.yaml -type f | head -n 1 | xargs -r dirname)
          else
            PROJECT="."
          fi
          if [ -z "$PROJECT" ]; then
            echo "::error::No pubspec.yaml found in repository or archive."
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT"
          ls -la "$PROJECT"

      - name: Install Dart dependencies
        working-directory: ${{ env.PROJECT }}
        run: flutter pub get

      - name: Analyze (non-blocking)
        working-directory: ${{ env.PROJECT }}
        run: flutter analyze
        continue-on-error: true

      - name: Run tests (non-blocking)
        working-directory: ${{ env.PROJECT }}
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        working-directory: ${{ env.PROJECT }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CobraNet-APK
          path: ${{ env.PROJECT }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT }}/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          
